<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="../assets/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="logo">AL.</div>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="skills.html">Skills</a>
            <a href="projects.html">Projects</a>
            <a href="contactmail.html">Contact Me</a>
        </div>
    </nav>

    <main class="container contact-page">
        <section class="contact-form-section">
            <h1>Get in Touch</h1>
            <p>Have a question or want to work together? Fill out the form below.</p>
            <form action="mailto:axel.lefebvre@epitech.eu" method="post" enctype="text/plain">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>
                <button type="submit" class="btn-primary">Send Message</button>
            </form>
        </section>

        <section class="download-section">
            <h2>My Resume</h2>
            <p>You can view my resume below or click the button to download it.</p>
            <div class="resume-viewer">
                <iframe src="../assets/cv.pdf" title="Axel Lefebvre's Resume"></iframe>
            </div>
            <a href="../assets/cv.pdf" download="Axel_Lefebvre_Resume.pdf" class="btn-secondary resume-download-btn">Download Resume</a>
        </section>
    </main>
</body>
</html>
